[workspace]
members = ["crates/core", "crates/server", "src-tauri"]
resolver = "2"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
[profile.release]
strip = true
